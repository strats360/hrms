name: Deploy

# One-click deploy to Cloudflare Workers with Neon Postgres.
# Runs the tests, applies database migrations, creates or updates the R2 bucket and
# Hyperdrive, deploys the Worker with the web app, sets secrets and smoke-tests it.
#
# Set these on the GitHub environment (Settings > Environments > production / staging):
#   Secrets  CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, NEON_DATABASE_URL,
#            BETTER_AUTH_SECRET, ENCRYPTION_KEY, RESEND_API_KEY (optional),
#            PLATFORM_ADMIN_PASSWORD (only to create the first platform admin),
#            CASHFREE_APP_ID, CASHFREE_SECRET_KEY (optional, online invoice payments)
#   Variables CUSTOM_DOMAIN, EMAIL_FROM, WORKER_NAME, CASHFREE_ENV (sandbox | production), all optional
# See docs/DEPLOY.md.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Where to deploy
        type: choice
        options: [staging, production]
        default: staging
      platform_admin_email:
        description: Create or promote this platform super admin (needs the PLATFORM_ADMIN_PASSWORD secret). Leave blank to skip.
        type: string
        required: false

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hrms
          POSTGRES_PASSWORD: hrms
          POSTGRES_DB: hrms_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hrms" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://hrms:hrms@localhost:5432/hrms_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      DEPLOY_ENV: ${{ inputs.environment }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
      EMAIL_FROM: ${{ vars.EMAIL_FROM }}
      WORKER_NAME: ${{ vars.WORKER_NAME }}
      CASHFREE_ENV: ${{ vars.CASHFREE_ENV }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Check configuration
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        run: |
          missing=""
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID DATABASE_URL BETTER_AUTH_SECRET ENCRYPTION_KEY; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing on the '${DEPLOY_ENV}' environment:${missing/DATABASE_URL/NEON_DATABASE_URL}. See docs/DEPLOY.md."
            exit 1
          fi
          [ ${#BETTER_AUTH_SECRET} -ge 32 ] || { echo "::error::BETTER_AUTH_SECRET must be at least 32 characters (openssl rand -base64 32)"; exit 1; }
          [ "$(printf %s "$ENCRYPTION_KEY" | base64 -d 2>/dev/null | wc -c)" -eq 32 ] || { echo "::error::ENCRYPTION_KEY must be 32 random bytes, base64 encoded (openssl rand -base64 32)"; exit 1; }

      - name: Apply database migrations
        run: pnpm db:migrate

      - name: Load reference data (plans, statutory master, feature flags)
        run: pnpm --filter @hrms/api bootstrap

      - name: Build the web app
        run: pnpm build

      - name: Provision Cloudflare resources
        id: provision
        run: node deploy/provision.mjs

      - name: Deploy the Worker
        working-directory: apps/api
        run: npx wrangler deploy -c wrangler.deploy.json

      - name: Set Worker secrets
        working-directory: apps/api
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CASHFREE_APP_ID: ${{ secrets.CASHFREE_APP_ID }}
          CASHFREE_SECRET_KEY: ${{ secrets.CASHFREE_SECRET_KEY }}
        run: |
          umask 077
          node -e 'const s={BETTER_AUTH_SECRET:process.env.BETTER_AUTH_SECRET,ENCRYPTION_KEY:process.env.ENCRYPTION_KEY}; for (const k of ["RESEND_API_KEY","CASHFREE_APP_ID","CASHFREE_SECRET_KEY"]) if(process.env[k]) s[k]=process.env[k]; require("fs").writeFileSync(process.env.RUNNER_TEMP+"/secrets.json", JSON.stringify(s))'
          npx wrangler secret bulk "$RUNNER_TEMP/secrets.json" -c wrangler.deploy.json
          rm -f "$RUNNER_TEMP/secrets.json"

      - name: Create the platform admin
        if: inputs.platform_admin_email != ''
        env:
          PLATFORM_ADMIN_PASSWORD: ${{ secrets.PLATFORM_ADMIN_PASSWORD }}
        run: |
          [ -n "$PLATFORM_ADMIN_PASSWORD" ] || { echo "::error::Set the PLATFORM_ADMIN_PASSWORD secret first"; exit 1; }
          pnpm --filter @hrms/api platform-admin -- --email "${{ inputs.platform_admin_email }}" --name "${{ inputs.platform_admin_email }}"

      - name: Smoke test
        env:
          APP_URL: ${{ steps.provision.outputs.app_url }}
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "$APP_URL/api/health?deep=1" -o health.json; then break; fi
            echo "waiting for $APP_URL ($i)"; sleep 6
          done
          cat health.json; echo
          node -e 'const h=require("./health.json"); if(!h.ok||!h.checks.database) process.exit(1); if(!h.checks.email) console.log("::warning::Email isn'"'"'t configured (RESEND_API_KEY / EMAIL_FROM). Invites and password resets won'"'"'t be sent."); if(!h.checks.payments) console.log("::warning::Cashfree isn'"'"'t configured (CASHFREE_APP_ID / CASHFREE_SECRET_KEY). Tenants pay invoices by bank transfer only.")'
          curl -fsS "$APP_URL/login" | grep -q 'id="root"'
          {
            echo "### Deployed ${DEPLOY_ENV}"
            echo "- URL: $APP_URL"
            echo "- Worker: ${{ steps.provision.outputs.worker_name }}"
            echo "- Version: $(node -p 'require("./health.json").version') · migrations: $(node -p 'require("./health.json").migrations')"
          } >> "$GITHUB_STEP_SUMMARY"
