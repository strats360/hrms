name: Rollback

# Roll the Worker back to its previous version (code only; database migrations are not undone).
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Which site (its GitHub environment, see deploy/instances.json)
        type: choice
        options: [staging, production, gulf, saudi, uk, us, canada]
        default: production
      version_id:
        description: Version to roll back to (blank = the previous one). See `wrangler deployments list`.
        type: string
        required: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Roll back
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_NAME: ${{ vars.WORKER_NAME }}
          TARGET: ${{ inputs.environment }}
          VERSION_ID: ${{ inputs.version_id }}
        run: |
          # the site's Worker comes from deploy/instances.json unless the environment overrides it
          NAME="${WORKER_NAME:-$(node ../../deploy/instances.mjs get "$TARGET" | node -pe 'JSON.parse(require("fs").readFileSync(0)).worker')}"
          echo "Rolling back $NAME"
          npx wrangler rollback $VERSION_ID --name "$NAME" --message "Rollback from GitHub Actions by ${{ github.actor }}" -y
