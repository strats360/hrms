name: Rollback

# Roll the Worker back to its previous version (code only; database migrations are not undone).
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging, production]
        default: production
      version_id:
        description: Version to roll back to (blank = the previous one). See `wrangler deployments list`.
        type: string
        required: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Roll back
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NAME: ${{ vars.WORKER_NAME || (inputs.environment == 'staging' && 'strats360-hrms-staging' || 'strats360-hrms') }}
        run: npx wrangler rollback ${{ inputs.version_id }} --name "$NAME" --message "Rollback from GitHub Actions by ${{ github.actor }}" -y
